[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe"
version = "0.1.0"
description = "Evaluation and monitoring platform for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3.0,<1.0.0",
    "langchain-openai>=0.3.0,<1.0.0",
    "langgraph>=0.2.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "openai>=1.0.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "python-multipart>=0.0.20,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0,<2.0.0",
    "pre-commit>=3.8.0,<5.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.6.0,<1.0.0",
    "types-PyYAML>=6.0.12.20240917",
]

[tool.setuptools]
py-modules = ["agentprobe_sdk"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.coverage.run]
branch = true
source = ["backend.app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["langchain_openai.*", "langgraph.*"]
ignore_missing_imports = true
