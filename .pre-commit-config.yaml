repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy backend agentprobe_sdk.py
        language: system
        pass_filenames: false
